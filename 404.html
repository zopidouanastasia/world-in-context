<style>

</style>
<script>
(function(){
  var GA_ID="G-V1D1FFJNVY";
  var KEY="wic-consent-v2";
  var banner=null;

  function readChoice(){
    try{return localStorage.getItem(KEY)}catch(e){return null}
  }
  function saveChoice(v){
    try{localStorage.setItem(KEY,v)}catch(e){}
  }

  function ensureDataLayer(){
    window.dataLayer=window.dataLayer||[];
    window.gtag=window.gtag||function(){window.dataLayer.push(arguments);};
  }

  function loadAnalytics(){
    if(window.__wicGA4Loaded) return;
    window.__wicGA4Loaded=true;
    ensureDataLayer();

    /* Basic Consent Mode v2: GA loads only after explicit acceptance. */
    gtag("consent","default",{
      analytics_storage:"granted",
      ad_storage:"denied",
      ad_user_data:"denied",
      ad_personalization:"denied"
    });

    var s=document.createElement("script");
    s.async=true;
    s.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(GA_ID);
    document.head.appendChild(s);

    gtag("js",new Date());
    gtag("config",GA_ID,{
      anonymize_ip:true,
      allow_google_signals:false,
      allow_ad_personalization_signals:false
    });
  }

  function buildBanner(){
    if(banner) return;
    banner=document.createElement("div");
    banner.className="wic-cc";
    banner.setAttribute("role","dialog");
    banner.setAttribute("aria-live","polite");
    banner.setAttribute("aria-label","Ρυθμίσεις cookies");
    banner.innerHTML=
      '<div class="wic-cc__in">'+
        '<div class="wic-cc__txt">'+
          '<b>Cookies & στατιστικά</b>'+
          'Χρησιμοποιούμε Google Analytics μόνο αν το επιλέξεις, για να βλέπουμε συγκεντρωτικά ποια θέματα διαβάζονται. '+
          'Δεν χρησιμοποιούμε διαφημιστική στόχευση ή Meta Pixel. '+
          '<a href="/privacy.html">Πολιτική απορρήτου</a>'+
        '</div>'+
        '<div class="wic-cc__btns">'+
          '<button type="button" class="wic-cc__b" data-consent="deny">Απόρριψη</button>'+
          '<button type="button" class="wic-cc__b wic-cc__b--yes" data-consent="accept">Αποδοχή στατιστικών</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(banner);

    banner.addEventListener("click",function(e){
      var btn=e.target.closest("[data-consent]");
      if(!btn) return;
      var choice=btn.getAttribute("data-consent");
      saveChoice(choice);
      banner.classList.remove("is-open");
      if(choice==="accept") loadAnalytics();
    });
  }

  function openSettings(){
    buildBanner();
    banner.classList.add("is-open");
  }
  window.wicCookies=openSettings;

  function init(){
    var choice=readChoice();
    if(choice==="accept") loadAnalytics();
    else if(choice!=="deny") openSettings();

    document.querySelectorAll('a[href="#cookies"],[data-open-cookie-settings]').forEach(function(a){
      a.addEventListener("click",function(e){
        e.preventDefault();
        openSettings();
      });
    });
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
