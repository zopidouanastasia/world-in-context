<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:#06172a;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(650px,100%);text-align:center} img{width:90px;height:60px;object-fit:contain;margin-bottom:24px}
small{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.12em;color:#ff9a32} h1{font-family:Fraunces,serif;font-size:clamp(42px,9vw,72px);margin:14px 0}
p{color:#dce9f5;font-size:18px;line-height:1.6} a{display:inline-block;margin-top:18px;padding:14px 20px;border-radius:10px;background:#ff7a00;color:white;text-decoration:none;font-weight:700}
</style>
<!-- CONSENT + GA4 START -->
<style>
.wic-cc{position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#fff;border-top:2px solid #07182c;box-shadow:0 -6px 24px rgba(7,24,44,.18);font-family:Inter,system-ui,sans-serif;padding:18px 20px;display:none}
.wic-cc.is-open{display:block}
.wic-cc__in{max-width:900px;margin:0 auto;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.wic-cc__txt{flex:1 1 380px;min-width:260px;color:#1B2A4A;font-size:14px;line-height:1.55}
.wic-cc__txt b{display:block;font-family:Fraunces,serif;font-size:16px;color:#07182c;margin-bottom:4px}
.wic-cc__txt a{color:#2C5D8F;text-decoration:underline}
.wic-cc__btns{display:flex;gap:10px;flex:0 0 auto;flex-wrap:wrap}
.wic-cc__b{font-family:Inter,system-ui,sans-serif;font-size:14px;font-weight:600;padding:11px 22px;border-radius:6px;cursor:pointer;border:2px solid #07182c;background:#fff;color:#07182c;transition:.15s}
.wic-cc__b:hover{background:#F1ECDF}
.wic-cc__b--yes{background:#ff7a00;border-color:#ff7a00;color:#fff}
.wic-cc__b--yes:hover{background:#ff9c3a;border-color:#ff9c3a}
.wic-cc__b:focus-visible{outline:3px solid #2C5D8F;outline-offset:2px}
@media(max-width:640px){.wic-cc{padding:16px}.wic-cc__in{gap:14px}.wic-cc__btns{width:100%}.wic-cc__b{flex:1 1 auto}}
</style>
<script>
(function(){
  var GA="G-V1D1FFJNVY", KEY="wic-consent", el=null;
  function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function loadGA(){
    if(window.__wicGA)return; window.__wicGA=1;
    var s=document.createElement("script");
    s.async=1; s.src="https://www.googletagmanager.com/gtag/js?id="+GA;
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments)}
    window.gtag=gtag; gtag("js",new Date());
    gtag("config",GA,{anonymize_ip:true});
  }
  function close(){ if(el) el.classList.remove("is-open"); }
  function decide(v){ set(v); close(); if(v==="yes") loadGA(); }
  function build(){
    if(el) return;
    el=document.createElement("div");
    el.className="wic-cc"; el.setAttribute("role","dialog");
    el.setAttribute("aria-live","polite");
    el.setAttribute("aria-label","Συγκατάθεση για cookies");
    el.innerHTML='<div class="wic-cc__in"><div class="wic-cc__txt"><b>Cookies</b>'
      +'Χρησιμοποιούμε ένα εργαλείο στατιστικών (Google Analytics) για να καταλαβαίνουμε ποια θέματα διαβάζονται. '
      +'Δεν πουλάμε δεδομένα και δεν κάνουμε διαφημιστική στόχευση. '
      +'<a href="/privacy.html">Πολιτική απορρήτου</a></div>'
      +'<div class="wic-cc__btns">'
      +'<button type="button" class="wic-cc__b" data-v="no">Απόρριψη</button>'
      +'<button type="button" class="wic-cc__b wic-cc__b--yes" data-v="yes">Αποδοχή</button>'
      +'</div></div>';
    document.body.appendChild(el);
    el.addEventListener("click",function(e){
      var b=e.target.closest("[data-v]"); if(b) decide(b.getAttribute("data-v"));
    });
  }
  function open(){ build(); el.classList.add("is-open"); }
  window.wicCookies=open;
  function init(){
    var c=get();
    if(c==="yes"){ loadGA(); }
    else if(c!=="no"){ open(); }
    document.querySelectorAll('a[href="#cookies"]').forEach(function(a){
      a.addEventListener("click",function(e){e.preventDefault();open()});
    });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
<!-- CONSENT + GA4 END -->
</head>
